name: Governance Policy Baseline

on:
  schedule:
    # Weekly on Monday at 05:00 UTC. Moved from daily-04:00 (May 2026) because
    # every drift PR now requires human review (auto-merge dropped, see
    # workflows/README.md). Weekly is enough to keep the baseline fresh.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force PR creation even if no changes detected"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Disable lefthook hooks on the runner — `npm ci` triggers the `prepare`
# script (`lefthook install`), which registers a pre-commit hook that calls
# `gitleaks`. gitleaks is not installed on the GitHub-hosted runner, so the
# create-pull-request commit fails with `gitleaks: not found`. Secrets
# scanning via gitleaks is a local pre-commit hook only.
env:
  LEFTHOOK: "0"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  collect-baseline:
    if: github.repository != 'jonathan-vella/apex' && github.repository != 'jonathan-vella/apex-accelerator' && github.repository != 'jonathan-vella/apex-docs' && github.event.repository.is_template != true && vars.GOVERNANCE_BASELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check governance configuration
        env:
          GOVERNANCE_MG_ID: ${{ vars.GOVERNANCE_MG_ID }}
        run: |
          if [[ -z "$GOVERNANCE_MG_ID" ]]; then
            echo "::error::Set GOVERNANCE_MG_ID before enabling governance collection."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create data directory
        run: mkdir -p .github/data

      - name: Collect governance baseline
        env:
          GOVERNANCE_MG_ID: ${{ vars.GOVERNANCE_MG_ID }}
          GOVERNANCE_MAX_SUBSCRIPTIONS: ${{ vars.GOVERNANCE_MAX_SUBSCRIPTIONS || '100' }}
        run: |
          pwsh tools/scripts/collect-governance-baseline.ps1 \
            -ManagementGroupId "$GOVERNANCE_MG_ID" \
            -MaxSubscriptions "$GOVERNANCE_MAX_SUBSCRIPTIONS"

      - name: Stage baseline file
        id: changes
        run: |
          git add .github/data/governance-policy-baseline.json.gz
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect MG ID change
        if: steps.changes.outputs.changed == 'true'
        id: mg-check
        run: |
          LOADER=.github/skills/apex-azure-governance-discovery/scripts/governance_baseline.py
          BASELINE=.github/data/governance-policy-baseline.json.gz
          CURRENT_MG=$(python3 "$LOADER" "$BASELINE" --get management_group_id)
          if git show HEAD:"$BASELINE" > /tmp/prior-governance-baseline.json.gz 2>/dev/null; then
            PRIOR_MG=$(python3 "$LOADER" /tmp/prior-governance-baseline.json.gz --get management_group_id)
          else
            PRIOR_MG=""
          fi
          if [[ -n "$PRIOR_MG" && "$CURRENT_MG" != "$PRIOR_MG" ]]; then
            echo "mg_changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Management Group ID changed: $PRIOR_MG → $CURRENT_MG"
          else
            echo "mg_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read baseline summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          LOADER=.github/skills/apex-azure-governance-discovery/scripts/governance_baseline.py
          BASELINE=.github/data/governance-policy-baseline.json.gz
          COVERAGE=$(python3 "$LOADER" "$BASELINE" --get coverage_status)
          PROCESSED=$(python3 "$LOADER" "$BASELINE" --get subscriptions_processed)
          SKIPPED=$(python3 "$LOADER" "$BASELINE" --get subscriptions_skipped --compact | jq 'length')
          EXCLUDED=$(python3 "$LOADER" "$BASELINE" --get subscriptions_excluded --compact | jq 'length')
          MG_ID=$(python3 "$LOADER" "$BASELINE" --get management_group_id)
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "processed=$PROCESSED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "excluded=$EXCLUDED" >> "$GITHUB_OUTPUT"
          echo "mg_id=$MG_ID" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: (steps.changes.outputs.changed == 'true' || github.event.inputs.force_update == 'true')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): Update governance policy baseline"
          branch: "chore/governance-baseline-update"
          delete-branch: true
          title: "chore(data): Update governance policy baseline"
          body: |
            Automated update of `.github/data/governance-policy-baseline.json.gz` from Management Group `${{ steps.summary.outputs.mg_id }}`.

            | Metric | Value |
            | --- | --- |
            | Coverage | ${{ steps.summary.outputs.coverage }} |
            | Subscriptions Processed | ${{ steps.summary.outputs.processed }} |
            | Subscriptions Skipped | ${{ steps.summary.outputs.skipped }} |
            | Subscriptions Excluded | ${{ steps.summary.outputs.excluded }} |
            | MG ID Changed | ${{ steps.mg-check.outputs.mg_changed }} |

            Generated by `Governance Policy Baseline` workflow.
          labels: |
            automation
            governance
            ${{ steps.mg-check.outputs.mg_changed == 'true' && 'needs-human-review' || '' }}
        id: cpr

      # Auto-merge is intentionally NOT enabled: GitHub Free private repos
      # do not support `gh pr merge --auto`. Every baseline-drift PR stays
      # open for human review. MG ID changes are still surfaced via the
      # `needs-human-review` label above + the warning log below.
      - name: Log MG change warning
        if: steps.cpr.outputs.pull-request-number != '' && steps.mg-check.outputs.mg_changed == 'true'
        run: |
          echo "⚠️ Management Group ID changed — PR carries the 'needs-human-review' label."

      - name: Log pull request
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          echo "✅ Opened/updated PR #${{ steps.cpr.outputs.pull-request-number }} — manual review + merge required."
          echo "🔗 ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Log no changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "ℹ️ No governance baseline changes detected — no PR created."
