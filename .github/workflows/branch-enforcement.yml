# Local hooks and CI execute the same branch policy scripts.
name: Branch Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-naming:
    name: Branch Naming Convention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash tools/scripts/validate-branch-naming.sh "$BRANCH_NAME"

  branch-scope:
    name: Branch Scope Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate branch scope
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: bash tools/scripts/validate-branch-scope.sh "$BRANCH_NAME" "origin/$BASE_BRANCH"
