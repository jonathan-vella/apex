# CI Workflow
# Independent checks for repository validation, external tools and secret scanning.
# Required merge checks are configured in GitHub rulesets/branch protection, not here.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Install pinned PowerShell analyzer (current user)
        run: npm run setup:powershell

      - name: Analyze maintained PowerShell scripts
        run: npm run lint:powershell

      - name: Test PowerShell analysis contract
        run: npm run test:powershell

      - name: Setup Python for executable tool tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Setup Terraform for executable tool tests
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run Node.js validators (CI-safe)
        run: npm run validate:_node-ci

      - name: Run Git hook tests
        run: npm run test:git-hooks

      - name: Re-render SKU manifest MD and check for drift
        run: |
          # Deterministic renderer must produce byte-equal MD for every
          # JSON. Drift here indicates an agent hand-edited the MD or
          # forgot to re-render after mutating JSON — both forbidden.
          # See: .github/instructions/sku-manifest.instructions.md
          shopt -s nullglob
          for json in agent-output/*/sku-manifest.json; do
            project=$(basename "$(dirname "$json")")
            echo "  rendering $project"
            node tools/scripts/render-sku-manifest-md.mjs "$project"
          done
          if ! git diff --exit-code -- '**/sku-manifest.md'; then
            echo "::error::sku-manifest.md is stale relative to JSON. Run 'node tools/scripts/render-sku-manifest-md.mjs <project>' and commit the result."
            exit 1
          fi

      - name: Validate handoff references
        run: bash tools/scripts/validate-handoff-references.sh

  external-tests:
    name: External Python tests (apex-recall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          # apex-recall ships its own deps via pyproject; install in editable mode
          # so its tests can import the package without sys.path hacks.
          python -m pip install -e tools/apex-recall
          python -m pip install -r requirements.txt

      - name: Install Graphviz renderer
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Lint Python (ruff)
        run: npm run lint:python

      - name: Run apex-recall test suite
        run: npm run test:apex-recall

      - name: Run Python tooling test suite
        run: npm run test:python-tools

  python-current:
    name: Current Python compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Setup current container Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"
          cache: "pip"

      - name: Install current Python dependencies
        run: |
          python -m pip install -e tools/apex-recall -r requirements.txt
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Test current Python without changing the supported minimum
        run: |
          npm run lint:python
          npm run test:apex-recall
          npm run test:python-tools

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs uv and gitleaks from the checksum-pinned devcontainer manifest.
      - name: Install pinned gitleaks
        run: sudo bash .devcontainer/install-build-tools.sh uv gitleaks

      - name: Scan git history
        run: gitleaks git --redact --no-banner .
