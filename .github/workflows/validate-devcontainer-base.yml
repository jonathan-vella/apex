# Builds complete baseline/head trees independently on native amd64 and arm64.
# A read-only candidate evaluator is the only shared validation input.
name: Dev Container Base Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/validate-devcontainer-base.yml"
      - "tools/scripts/validate-devcontainer.sh"
      - "tools/scripts/compare-devcontainer-verdicts.mjs"
      - "tools/tests/compare-devcontainer-verdicts.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Complete baseline Git revision (candidate is the selected workflow revision)"
        required: true
        default: "origin/main"
        type: string
      baseline_distro_id:
        description: "Expected baseline /etc/os-release ID (empty derives an official image tag)"
        required: false
        type: string
      baseline_os:
        description: "Expected baseline VERSION_ID (empty derives an official Ubuntu or Azure Linux image tag)"
        required: false
        type: string
      candidate_distro_id:
        description: "Expected candidate /etc/os-release ID"
        required: true
        default: "azurelinux"
        type: string
      candidate_os:
        description: "Expected candidate /etc/os-release VERSION_ID"
        required: true
        default: "4.0"
        type: string

permissions:
  contents: read

env:
  # Verified against the selected index and both platform manifests.
  CANDIDATE_DIGEST: sha256:63ef5dda2fb5681ae3aa5c9597a8c4b24364da91ec459b419fa3c38160595fae
  CANDIDATE_AMD64_DIGEST: sha256:9070b05147f01e5a4bac47723c95f2555e11b9d3324c1df1910ff3545b7ce319
  CANDIDATE_ARM64_DIGEST: sha256:e541db83a8511c25fa1dd989161263874b7395ddd588f5caaa25453ea4e23263
  DEVCONTAINER_BASE_SCRIPT: |
    import fs from "node:fs";
    import path from "node:path";
    import { execFileSync } from "node:child_process";
    import { parseJsonc } from "./tools/scripts/_lib/parse-jsonc.mjs";

    const [revision] = process.argv.slice(1);
    const readSource = (file) => execFileSync("git", ["show", `${revision}:${file}`], { encoding: "utf8" });
    const config = parseJsonc(readSource(".devcontainer/devcontainer.json"));
    if (!config || typeof config !== "object" || Array.isArray(config)) throw new Error("Invalid devcontainer config");
    if (Object.hasOwn(config, "image") === Object.hasOwn(config, "build")) {
      throw new Error("Expected exactly one of image or build");
    }
    let baseImage = config.image;
    if (Object.hasOwn(config, "build")) {
      const dockerfile = config.build?.dockerfile;
      if (typeof dockerfile !== "string" || !dockerfile || /[\r\n]/.test(dockerfile) || path.isAbsolute(dockerfile)) {
        throw new Error("Expected a repository-relative build.dockerfile");
      }
      const sourceFile = path.posix.normalize(path.posix.join(".devcontainer", dockerfile));
      if (sourceFile.startsWith("../")) throw new Error("Dockerfile must remain in the repository");
      const declarations = [...readSource(sourceFile).matchAll(/^[\t ]*FROM\b[^\r\n]*/gim)];
      const from = /^[\t ]*FROM[\t ]+(?:--platform=[^\s]+[\t ]+)?([^\s]+)(?:[\t ]+AS[\t ]+[\w.-]+)?[\t ]*$/i.exec(declarations[0]?.[0] ?? "");
      if (declarations.length !== 1 || !from) throw new Error("Expected one literal Dockerfile FROM instruction");
      baseImage = from[1];
    }
    if (typeof baseImage !== "string" || !/^[a-zA-Z0-9][a-zA-Z0-9._/:@-]*$/.test(baseImage)) {
      throw new Error("Expected a literal base image, not an ARG or empty value");
    }
    process.stdout.write(baseImage);
  DEVCONTAINER_VALIDATION_CONFIG_SCRIPT: |
    import fs from "node:fs";
    import path from "node:path";
    import * as prettier from "prettier";
    import { parseJsonc } from "./tools/scripts/_lib/parse-jsonc.mjs";

    const root = path.resolve("validation-source");
    const configPath = path.join(root, ".devcontainer/devcontainer.json");
    const config = parseJsonc(fs.readFileSync(configPath, "utf8"));
    // Do not expose host credentials or reuse cache volumes between revisions.
    const evaluator = path.resolve("devcontainer-evaluator");
    fs.mkdirSync(evaluator);
    for (const file of ["validate-devcontainer.sh", "compare-devcontainer-verdicts.mjs"]) {
      fs.copyFileSync(path.join("tools/scripts", file), path.join(evaluator, file));
    }
    fs.mkdirSync(path.join(evaluator, "_lib"));
    fs.copyFileSync("tools/scripts/_lib/parse-jsonc.mjs", path.join(evaluator, "_lib/parse-jsonc.mjs"));
    fs.cpSync("node_modules/jsonc-parser", path.join(evaluator, "node_modules/jsonc-parser"), { recursive: true });
    config.mounts = [`type=bind,source=${evaluator},target=/opt/apex-evaluator,readonly`];
    config.remoteEnv = { ...config.remoteEnv, GH_TOKEN: "", GITHUB_TOKEN: "" };
    config.containerEnv = { ...config.containerEnv, GH_TOKEN: "", GITHUB_TOKEN: "" };
    config.waitFor = "postCreateCommand";
    // Co-location preserves relative paths and the CLI's devcontainer-lock.json lookup.
    const output = path.join(root, ".devcontainer/devcontainer.json");
    const sourceBackup = path.join(evaluator, "source-devcontainer.json");
    if (fs.existsSync(sourceBackup)) throw new Error("Refusing to overwrite existing validation backup");
    fs.renameSync(configPath, sourceBackup);
    const formatted = await prettier.format(JSON.stringify(config), {
      ...await prettier.resolveConfig(sourceBackup), filepath: output,
    });
    fs.writeFileSync(output, formatted, { flag: "wx" });

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Resolve trees and manifest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      baseline_sha: ${{ steps.images.outputs.baseline_sha }}
      candidate_sha: ${{ steps.images.outputs.candidate_sha }}
      baseline_image: ${{ steps.images.outputs.baseline_image }}
      baseline_distro_id: ${{ steps.images.outputs.baseline_distro_id }}
      baseline_os: ${{ steps.images.outputs.baseline_os }}
      candidate_image: ${{ steps.images.outputs.candidate_image }}
      candidate_distro_id: ${{ steps.images.outputs.candidate_distro_id }}
      candidate_os: ${{ steps.images.outputs.candidate_os }}
      candidate_digest: ${{ steps.manifest.outputs.candidate_digest }}
    steps:
      - name: Checkout candidate evaluator
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install evaluator dependencies without shared caching
        run: npm ci

      - name: Resolve baseline and candidate trees
        id: images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASELINE_REF: ${{ inputs.baseline_ref || 'origin/main' }}
          INPUT_BASELINE_DISTRO_ID: ${{ inputs.baseline_distro_id }}
          INPUT_BASELINE_OS: ${{ inputs.baseline_os }}
          INPUT_CANDIDATE_DISTRO_ID: ${{ inputs.candidate_distro_id || 'azurelinux' }}
          INPUT_CANDIDATE_OS: ${{ inputs.candidate_os || '4.0' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline_sha="$BASE_SHA"
          else
            baseline_sha=$(git rev-parse --verify --end-of-options "${INPUT_BASELINE_REF}^{commit}")
          fi
          candidate_sha=$(git rev-parse HEAD)
          baseline_image=$(node --input-type=module -e "$DEVCONTAINER_BASE_SCRIPT" "$baseline_sha")
          candidate_image=$(node --input-type=module -e "$DEVCONTAINER_BASE_SCRIPT" "$candidate_sha")
          [[ "$candidate_image" == "mcr.microsoft.com/azurelinux-beta/base/core:4.0@${CANDIDATE_DIGEST}" ]]
          if [[ -z "$INPUT_BASELINE_OS" || -z "$INPUT_BASELINE_DISTRO_ID" ]]; then
            baseline_tag="${baseline_image%%@*}"
            case "$baseline_tag" in
              mcr.microsoft.com/devcontainers/base:ubuntu*)
                inferred_distro=ubuntu
                inferred_os="${baseline_tag##*:ubuntu}"
                inferred_os="${inferred_os#-}"
                [[ "$inferred_os" =~ ^[0-9]{2}\.[0-9]{2}$ ]]
                ;;
              mcr.microsoft.com/azurelinux/base/core:*|mcr.microsoft.com/azurelinux-beta/base/core:*)
                inferred_distro=azurelinux
                inferred_os="${baseline_tag##*:}"
                [[ "$inferred_os" =~ ^[0-9]+\.[0-9]+$ ]]
                ;;
              *)
                printf 'Explicit baseline distro/version inputs are required for this image\n' >&2
                exit 1
                ;;
            esac
            INPUT_BASELINE_DISTRO_ID="${INPUT_BASELINE_DISTRO_ID:-$inferred_distro}"
            INPUT_BASELINE_OS="${INPUT_BASELINE_OS:-$inferred_os}"
          fi
          for value in "$INPUT_BASELINE_DISTRO_ID" "$INPUT_BASELINE_OS" "$INPUT_CANDIDATE_DISTRO_ID" "$INPUT_CANDIDATE_OS"; do
            [[ "$value" =~ ^[a-zA-Z0-9._-]+$ ]]
          done
          printf 'baseline_sha=%s\ncandidate_sha=%s\n' "$baseline_sha" "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'baseline_image=%s\ncandidate_image=%s\n' "$baseline_image" "$candidate_image" >> "$GITHUB_OUTPUT"
          printf 'baseline_distro_id=%s\nbaseline_os=%s\n' "$INPUT_BASELINE_DISTRO_ID" "$INPUT_BASELINE_OS" >> "$GITHUB_OUTPUT"
          printf 'candidate_distro_id=%s\ncandidate_os=%s\n' "$INPUT_CANDIDATE_DISTRO_ID" "$INPUT_CANDIDATE_OS" >> "$GITHUB_OUTPUT"

      - name: Verify candidate multi-architecture manifest
        id: manifest
        env:
          CANDIDATE_IMAGE: ${{ steps.images.outputs.candidate_image }}
        run: |
          docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE" > "${RUNNER_TEMP}/candidate-manifest.json"
          actual_digest="sha256:$(sha256sum "${RUNNER_TEMP}/candidate-manifest.json" | cut -d ' ' -f 1)"
          [[ "$actual_digest" == "$CANDIDATE_DIGEST" ]]
          for arch in amd64 arm64; do
            if [[ "$arch" == amd64 ]]; then expected="$CANDIDATE_AMD64_DIGEST"; else expected="$CANDIDATE_ARM64_DIGEST"; fi
            jq -e --arg arch "$arch" --arg digest "$expected" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | length == 1 and .[0].digest == $digest' \
              "${RUNNER_TEMP}/candidate-manifest.json" > /dev/null
          done
          printf 'candidate_digest=%s\n' "$actual_digest" >> "$GITHUB_OUTPUT"

      - name: Upload candidate manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-candidate-manifest
          path: ${{ runner.temp }}/candidate-manifest.json
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: candidate
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # Native ARM is intentional: emulation is not acceptance evidence.
          - variant: baseline
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: candidate
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout candidate evaluator
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install evaluator dependencies without shared caching
        run: npm ci

      - name: Checkout complete validation tree
        uses: actions/checkout@v7
        with:
          path: validation-source
          persist-credentials: false
          ref: ${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_sha || needs.preflight.outputs.candidate_sha }}

      - name: Prepare credential-free evaluator mount
        run: node --input-type=module -e "$DEVCONTAINER_VALIDATION_CONFIG_SCRIPT"

      - name: Build and validate dev container
        uses: devcontainers/ci@v0.3
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          USERPROFILE: ""
          APEX_EXPECTED_BASE_IMAGE: ${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_image || needs.preflight.outputs.candidate_image }}
          SELECTED_DISTRO_ID: ${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_distro_id || needs.preflight.outputs.candidate_distro_id }}
          SELECTED_OS: ${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_os || needs.preflight.outputs.candidate_os }}
          SELECTED_VARIANT: ${{ matrix.variant }}
          SELECTED_ARCH: ${{ matrix.arch }}
        with:
          # checkoutPath and configFile are action.yml inputs; paths resolve from this checkout.
          checkoutPath: validation-source
          configFile: .devcontainer/devcontainer.json
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          push: never
          inheritEnv: false
          env: |
            GH_TOKEN=
            GITHUB_TOKEN=
            APEX_EXPECTED_BASE_IMAGE
            SELECTED_DISTRO_ID
            SELECTED_OS
            SELECTED_VARIANT
            SELECTED_ARCH
          runCmd: >-
            cp /opt/apex-evaluator/source-devcontainer.json .devcontainer/devcontainer.json &&
            bash /opt/apex-evaluator/validate-devcontainer.sh
            --workspace-root "$PWD"
            --variant "$SELECTED_VARIANT"
            --expected-distro-id "$SELECTED_DISTRO_ID"
            --expected-os "$SELECTED_OS"
            --expected-arch "$SELECTED_ARCH"
            --output-dir "tmp/devcontainer-validation/$SELECTED_VARIANT-$SELECTED_ARCH"

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-validation-${{ matrix.variant }}-${{ matrix.arch }}
          path: validation-source/tmp/devcontainer-validation/${{ matrix.variant }}-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Compare base-image verdicts
    if: always()
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate evaluator
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install evaluator dependencies without shared caching
        run: npm ci

      - name: Download matrix verdicts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: devcontainer-validation-*
          path: tmp/devcontainer-validation-artifacts

      - name: Compare verdicts
        id: comparison
        continue-on-error: true
        env:
          CANDIDATE_IMAGE: ${{ needs.preflight.outputs.candidate_image || 'unresolved' }}
          CANDIDATE_DIGEST: ${{ needs.preflight.outputs.candidate_digest || 'unresolved' }}
        run: |
          node tools/scripts/compare-devcontainer-verdicts.mjs \
            --input tmp/devcontainer-validation-artifacts \
            --output tmp/devcontainer-validation-summary/verdict-summary.json \
            --markdown tmp/devcontainer-validation-summary/summary.md \
            --candidate-image "$CANDIDATE_IMAGE" \
            --candidate-digest "$CANDIDATE_DIGEST"

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f tmp/devcontainer-validation-summary/summary.md ]]; then
            cat tmp/devcontainer-validation-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Dev Container Base Validation\n\n**Overall verdict:** BLOCKED\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload consolidated verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-validation-summary
          path: tmp/devcontainer-validation-summary/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce fail-closed verdict
        if: >-
          always() &&
          (needs.preflight.result != 'success' ||
           needs.validate.result != 'success' ||
           steps.comparison.outcome != 'success')
        run: exit 1
