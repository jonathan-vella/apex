# Dev Container Base Validation
# Compares candidate and baseline images on native amd64 and arm64 runners.
# Runs on same-repository pull requests and manual dispatches.

name: Dev Container Base Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/validate-devcontainer-base.yml"
      - "tools/scripts/validate-devcontainer.sh"
      - "tools/scripts/compare-devcontainer-verdicts.mjs"
      - "tools/tests/compare-devcontainer-verdicts.test.mjs"
  workflow_dispatch:
    inputs:
      candidate_image:
        description: "Dev container base image to validate"
        required: true
        default: "mcr.microsoft.com/devcontainers/base:ubuntu26.04"
        type: string
      candidate_os:
        description: "Expected Ubuntu VERSION_ID inside the candidate"
        required: true
        default: "26.04"
        type: string

permissions:
  contents: read

env:
  DEVCONTAINER_BASE_SCRIPT: |
    import fs from "node:fs";
    import path from "node:path";
    import { execFileSync } from "node:child_process";
    import { modify, applyEdits } from "jsonc-parser";
    import { parseJsonc } from "./tools/scripts/_lib/parse-jsonc.mjs";

    const [operation, revision] = process.argv.slice(1);
    if (!["extract", "rewrite"].includes(operation)) throw new Error("Unknown base-image operation");
    const readSource = (file) => revision
      ? execFileSync("git", ["show", `${revision}:${file}`], { encoding: "utf8" })
      : fs.readFileSync(file, "utf8");
    const configFile = ".devcontainer/devcontainer.json";
    const configText = readSource(configFile);
    const config = parseJsonc(configText);
    if (!config || typeof config !== "object" || Array.isArray(config)) throw new Error("Invalid devcontainer config");
    if (Object.hasOwn(config, "image") === Object.hasOwn(config, "build")) {
      throw new Error("Expected exactly one of image or build");
    }

    let sourceFile = configFile;
    let sourceText = configText;
    let baseImage = config.image;
    let from;
    if (Object.hasOwn(config, "build")) {
      const dockerfile = config.build?.dockerfile;
      if (typeof dockerfile !== "string" || !dockerfile || /[\r\n]/.test(dockerfile) || path.isAbsolute(dockerfile)) {
        throw new Error("Expected a repository-relative build.dockerfile");
      }
      sourceFile = path.posix.normalize(path.posix.join(".devcontainer", dockerfile));
      if (sourceFile.startsWith("../")) throw new Error("Dockerfile must remain in the repository");
      sourceText = readSource(sourceFile);
      const declarations = [...sourceText.matchAll(/^[\t ]*FROM\b[^\r\n]*/gim)];
      from = /^([\t ]*FROM[\t ]+(?:--platform=[^\s]+[\t ]+)?)([^\s]+)(?:[\t ]+AS[\t ]+[\w.-]+)?[\t ]*$/i.exec(declarations[0]?.[0] ?? "");
      if (declarations.length !== 1 || !from) throw new Error("Expected one literal Dockerfile FROM instruction");
      from.index = declarations[0].index + from[1].length;
      baseImage = from[2];
    }
    const validImage = (image) => typeof image === "string" && /^[a-zA-Z0-9][a-zA-Z0-9._/:@-]*$/.test(image);
    if (!validImage(baseImage)) throw new Error("Expected a literal base image, not an ARG or empty value");
    if (operation === "extract") {
      process.stdout.write(baseImage);
    } else {
      const selected = process.env.SELECTED_IMAGE;
      if (!validImage(selected)) throw new Error("Invalid selected base image");
      const updated = from
        ? sourceText.slice(0, from.index) + selected + sourceText.slice(from.index + baseImage.length)
        : applyEdits(configText, modify(configText, ["image"], selected, {}));
      fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "devcontainer-backup.json"), JSON.stringify([
        { file: configFile, text: configText },
        ...(from ? [{ file: sourceFile, text: sourceText }] : []),
      ]));
      fs.writeFileSync(sourceFile, updated);
      if (!from && parseJsonc(updated).image !== selected) throw new Error("Base image rewrite failed");
    }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Resolve images and manifest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      baseline_image: ${{ steps.images.outputs.baseline_image }}
      baseline_os: ${{ steps.images.outputs.baseline_os }}
      candidate_image: ${{ steps.images.outputs.candidate_image }}
      candidate_os: ${{ steps.images.outputs.candidate_os }}
      candidate_digest: ${{ steps.manifest.outputs.candidate_digest }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Resolve baseline and candidate images
        id: images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          INPUT_CANDIDATE_OS: ${{ inputs.candidate_os }}
        run: |
          extract_image() {
            node --input-type=module -e "$DEVCONTAINER_BASE_SCRIPT" extract "$@"
          }

          image_os() {
            local image="${1%%@*}"
            local version
            case "$image" in
              *:ubuntu-*) version="${image##*:ubuntu-}" ;;
              *:ubuntu[0-9]*) version="${image##*:ubuntu}" ;;
              ubuntu:*|*/ubuntu:*) version="${image##*:}" ;;
              *) return 1 ;;
            esac
            [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || return 1
            printf '%s' "$version"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline_image=$(extract_image "$BASE_SHA")
            candidate_image=$(extract_image)
            baseline_os=$(image_os "$baseline_image")
            candidate_os=$(image_os "$candidate_image")
          else
            baseline_image=$(extract_image)
            candidate_image="$INPUT_CANDIDATE_IMAGE"
            baseline_os=$(image_os "$baseline_image")
            candidate_os="$INPUT_CANDIDATE_OS"
          fi

          printf 'baseline_image=%s\n' "$baseline_image" >> "$GITHUB_OUTPUT"
          printf 'baseline_os=%s\n' "$baseline_os" >> "$GITHUB_OUTPUT"
          printf 'candidate_image=%s\n' "$candidate_image" >> "$GITHUB_OUTPUT"
          printf 'candidate_os=%s\n' "$candidate_os" >> "$GITHUB_OUTPUT"

      - name: Verify candidate multi-architecture manifest
        id: manifest
        env:
          CANDIDATE_IMAGE: ${{ steps.images.outputs.candidate_image }}
        run: |
          docker buildx imagetools inspect --raw "$CANDIDATE_IMAGE" > "${RUNNER_TEMP}/candidate-manifest.json"
          jq -e '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | index("amd64") != null' \
            "${RUNNER_TEMP}/candidate-manifest.json" > /dev/null
          jq -e '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | index("arm64") != null' \
            "${RUNNER_TEMP}/candidate-manifest.json" > /dev/null
          candidate_digest=$(docker buildx imagetools inspect "$CANDIDATE_IMAGE" \
            | awk '$1 == "Digest:" { print $2; exit }')
          [[ -n "$candidate_digest" ]]
          printf 'candidate_digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"

      - name: Upload candidate manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-candidate-manifest
          path: ${{ runner.temp }}/candidate-manifest.json
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - variant: candidate
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # Native ARM is intentional: CPU-vendor portability is part of the contract.
          - variant: baseline
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: candidate
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Create repo-relative validation config
        env:
          SELECTED_IMAGE: >-
            ${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_image || needs.preflight.outputs.candidate_image }}
        run: |
          node --input-type=module -e "$DEVCONTAINER_BASE_SCRIPT" rewrite
          actual=$(node --input-type=module -e "$DEVCONTAINER_BASE_SCRIPT" extract)
          [[ "$actual" == "$SELECTED_IMAGE" ]]

      - name: Prepare host bind mounts
        run: mkdir -p "$HOME/.azure"

      - name: Build and validate dev container
        uses: devcontainers/ci@v0.3
        env:
          GH_TOKEN: ""
          USERPROFILE: ""
        with:
          configFile: .devcontainer/devcontainer.json
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          push: never
          runCmd: >-
            env APEX_EXPECTED_BASE_IMAGE='${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_image || needs.preflight.outputs.candidate_image }}'
            bash tools/scripts/validate-devcontainer.sh
            --variant ${{ matrix.variant }}
            --expected-os ${{ matrix.variant == 'baseline' && needs.preflight.outputs.baseline_os || needs.preflight.outputs.candidate_os }}
            --expected-arch ${{ matrix.arch }}
            --output-dir tmp/devcontainer-validation/${{ matrix.variant }}-${{ matrix.arch }}

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-validation-${{ matrix.variant }}-${{ matrix.arch }}
          path: tmp/devcontainer-validation/${{ matrix.variant }}-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Restore original dev container config
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const backup = path.join(process.env.RUNNER_TEMP, "devcontainer-backup.json");
            if (fs.existsSync(backup)) {
              for (const { file, text } of JSON.parse(fs.readFileSync(backup, "utf8"))) fs.writeFileSync(file, text);
            }
          '

  compare:
    name: Compare base-image verdicts
    if: always()
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: ./.github/actions/setup-node-repo

      - name: Download matrix verdicts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: devcontainer-validation-*
          path: tmp/devcontainer-validation-artifacts

      - name: Compare verdicts
        id: comparison
        continue-on-error: true
        env:
          CANDIDATE_IMAGE: ${{ needs.preflight.outputs.candidate_image || 'unresolved' }}
          CANDIDATE_DIGEST: ${{ needs.preflight.outputs.candidate_digest || 'unresolved' }}
        run: |
          node tools/scripts/compare-devcontainer-verdicts.mjs \
            --input tmp/devcontainer-validation-artifacts \
            --output tmp/devcontainer-validation-summary/verdict-summary.json \
            --markdown tmp/devcontainer-validation-summary/summary.md \
            --candidate-image "$CANDIDATE_IMAGE" \
            --candidate-digest "$CANDIDATE_DIGEST"

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f tmp/devcontainer-validation-summary/summary.md ]]; then
            cat tmp/devcontainer-validation-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Dev Container Base Validation\n\n**Overall verdict:** BLOCKED\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload consolidated verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-validation-summary
          path: tmp/devcontainer-validation-summary/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce fail-closed verdict
        if: >-
          always() &&
          (needs.preflight.result != 'success' ||
           needs.validate.result != 'success' ||
           steps.comparison.outcome != 'success')
        run: exit 1
