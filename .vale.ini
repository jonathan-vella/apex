# Vale Configuration for APEX
# https://vale.sh/docs/topics/config/

StylesPath = .vale/styles

# Minimum alert level (suggestion, warning, error)
MinAlertLevel = warning

# Packages to use when running `vale sync`
Packages = Microsoft

# Project-specific vocabulary (.vale/styles/Vocab/APEX/{accept,reject}.txt)
Vocab = APEX

# Ignore code blocks, inline code, HTML elements, and URLs
SkippedScopes = script, style, pre, figure, code, tt
IgnoredScopes = code, tt, img, url, a

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, APEX

# Ignore fenced code blocks, frontmatter, HTML comments, and inline code
BlockIgnores = (?s)(`{3}.*?`{3}), (?s)(^---.*?---), (?s)(<!--.*?-->)
TokenIgnores = (`[^`]+`), (\{[a-zA-Z0-9_.-]+\}), (https?://[^\s)]+)

[.github/**/*.md]
BasedOnStyles = Vale, Microsoft, APEX
# Agent, skill, and instruction definitions are dense technical specifications
Microsoft.Contractions = suggestion
Microsoft.Passive = suggestion
Microsoft.We = off
APEX.PlaceholderText = off

[agent-output/**/*.md]
BasedOnStyles = Vale, Microsoft, APEX
Microsoft.Passive = suggestion
APEX.BrandTerminology = error
APEX.PlaceholderText = error

[README.md]
BasedOnStyles = Vale, Microsoft, APEX
